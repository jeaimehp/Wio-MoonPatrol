; Moon Patrol desk buddy for the Seeed Wio Terminal (ATSAMD51P19).
; The display library is Seeed_Arduino_LCD 1.6.0 shipped with the
; Seeed SAMD board package. Registry 2.0.3 targets XIAO boards instead.
[env:seeed_wio_terminal]
platform = atmelsam
board = seeed_wio_terminal
framework = arduino
monitor_speed = 115200
; Clock for the HUD. The SAMD51 RTC runs from the 32 kHz crystal and is
; set from the Mac over serial (tools/set_clock.py).
lib_deps =
    seeed-studio/Seeed Arduino RTC
